name: Apartment CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apartment-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unit, lint, coverage, types, web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://apartment:unused_ci_only@127.0.0.1:5432/apartment
      LINE_CHANNEL_ID: ci-placeholder-no-real-provider
      WEB_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
      LINE_OUTBOUND_MODE: disabled
      LINE_WORKER_MODE: observe
      LINE_WORKER_APPROVED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pinned pnpm via Corepack
        run: |
          npm install -g corepack@0.36.0
          corepack enable
          corepack pnpm --version
      - name: Install exact lockfile
        run: corepack pnpm install --frozen-lockfile
      - name: Security audit — block High and Critical advisories
        run: corepack pnpm audit --audit-level high
      - name: Whitespace validation
        run: git diff --check HEAD^ HEAD
      - name: Offline backup script syntax safety
        run: |
          bash -n infra/deploy-apartment-dev.sh
          bash -n infra/build-apartment-dev.sh
          bash -n infra/verify-apartment-dev.sh
          bash -n infra/local-archive-apartment-postgres.sh
          bash -n infra/test-api-postgres-coverage.sh
          bash -n infra/tests/local-backup-config.test.sh
          bash -n infra/tests/local-archive-integration.test.sh
          bash -n infra/backup-apartment-postgres.sh
          bash -n infra/rehearse-apartment-migration-rollback.sh
          bash -n infra/offsite-apartment-postgres.sh
          bash -n infra/retrieve-offsite-apartment-postgres.sh
          bash -n infra/tests/offsite-apartment-postgres.test.sh
          bash -n infra/tests/offsite-upload-mock.test.sh
      - name: LINE observer cannot send live (static guard)
        run: |
          grep -q 'LINE_WORKER_MODE=observe LINE_WORKER_APPROVED=false LINE_OUTBOUND_MODE=disabled' infra/systemd/apartment-line-outbox-observer.service
          grep -q 'ConditionPathExists=/etc/apartment/line-worker.env' infra/systemd/apartment-line-outbox-observer.service
      - name: Drizzle migration snapshot consistency
        run: corepack pnpm --filter @apartment/api exec drizzle-kit check
      - name: Unit tests
        run: corepack pnpm test
      - name: TypeScript lint (zero warnings enforced)
        run: corepack pnpm lint
      - name: Coverage regression gate (API baseline; domain >=80%)
        run: |
          # This unit-only V8 suite has a separate 39% regression floor.
          # The disposable PostgreSQL HTTP job enforces >=80% across all API source files.
          corepack pnpm --filter @apartment/domain exec vitest run --coverage --coverage.include='src/**/*.ts' --coverage.reporter=text-summary --coverage.thresholds.lines=80
          corepack pnpm --filter @apartment/api exec vitest run --coverage --coverage.include='src/**/*.ts' --coverage.reporter=text-summary --coverage.thresholds.lines=39
      - name: TypeScript
        run: corepack pnpm typecheck
      - name: Web production build (no live LIFF key)
        run: corepack pnpm --filter @apartment/web build
        env:
          NODE_ENV: production
          VITE_LIFF_ID: ''
      - name: Install isolated Playwright Chromium
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Browser E2E (mocked API, desktop + mobile; no real LINE sends)
        run: corepack pnpm exec playwright test
        env:
          VITE_LIFF_ID: ''

  postgres-security:
    name: PostgreSQL migration, HTTP security and API coverage >=80%
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pinned pnpm via Corepack
        run: |
          npm install -g corepack@0.36.0
          corepack enable
      - name: Install exact lockfile
        run: corepack pnpm install --frozen-lockfile
      - name: Install browser for backend-connected workflows
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Disposable migration, HTTP security, >=80% coverage and real backend browser workflows
        run: corepack pnpm coverage:api:postgres
        env:
          APARTMENT_POSTGRES_BROWSER: '1'
      - name: Preserve API PostgreSQL coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-postgres-coverage
          path: coverage/postgres/coverage-summary.json
          if-no-files-found: warn
