name: Apartment CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apartment-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unit, types, web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://apartment:unused_ci_only@127.0.0.1:5432/apartment
      LINE_CHANNEL_ID: ci-placeholder-no-real-provider
      WEB_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
      LINE_OUTBOUND_MODE: disabled
      LINE_WORKER_MODE: observe
      LINE_WORKER_APPROVED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pinned pnpm via Corepack
        run: |
          npm install -g corepack@0.36.0
          corepack enable
          corepack pnpm --version
      - name: Install exact lockfile
        run: corepack pnpm install --frozen-lockfile
      - name: Whitespace validation
        run: git diff --check HEAD^ HEAD
      - name: Drizzle migration snapshot consistency
        run: corepack pnpm --filter @apartment/api exec drizzle-kit check
      - name: Unit tests
        run: corepack pnpm test
      - name: TypeScript
        run: corepack pnpm typecheck
      - name: Web production build (no live LIFF key)
        run: corepack pnpm --filter @apartment/web build
        env:
          VITE_LIFF_ID: ''

  postgres-security:
    name: PostgreSQL migration and isolated HTTP security smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apartment
          POSTGRES_PASSWORD: apartment_ci_only
          POSTGRES_DB: apartment
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U apartment -d apartment"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      NODE_ENV: development # Required for loopback HTTP S3 mock; CI is an isolated disposable DEV-only DB.
      DATABASE_URL: postgresql://apartment:apartment_ci_only@127.0.0.1:5432/apartment
      HOST: 127.0.0.1
      PORT: '8088'
      LINE_CHANNEL_ID: ci-placeholder-no-real-provider
      COOKIE_SECURE: 'false'
      WEB_ORIGIN: http://localhost:5173
      EVIDENCE_STORAGE_DRIVER: local
      EVIDENCE_MALWARE_SCANNER: disabled
      LINE_OUTBOUND_MODE: disabled
      LINE_WORKER_MODE: observe
      LINE_WORKER_APPROVED: 'false'
      LINE_GLOBAL_PER_MINUTE: '20'
      LINE_ORG_PER_MINUTE: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pinned pnpm via Corepack
        run: |
          npm install -g corepack@0.36.0
          corepack enable
      - name: Install exact lockfile
        run: corepack pnpm install --frozen-lockfile
      - name: Migrate clean disposable PostgreSQL
        run: corepack pnpm --filter @apartment/api db:migrate
      - name: Verify tenant, staff and finance isolation
        run: |
          corepack pnpm --filter @apartment/api smoke
          corepack pnpm --filter @apartment/api smoke:staff
          corepack pnpm --filter @apartment/api exec tsx scripts/smoke-independent-security.ts
          corepack pnpm --filter @apartment/api smoke:load-gates
      - name: Regression HTTP
        run: |
          corepack pnpm --filter @apartment/api smoke:http
          corepack pnpm --filter @apartment/api smoke:payments
          corepack pnpm --filter @apartment/api smoke:finance
          corepack pnpm --filter @apartment/api smoke:maintenance
      - name: LINE/Evidence mocks (no external delivery)
        run: |
          corepack pnpm --filter @apartment/api smoke:line
          corepack pnpm --filter @apartment/api smoke:consent
          corepack pnpm --filter @apartment/api smoke:s3
          corepack pnpm --filter @apartment/api smoke:cleanup
