# Dokploy-managed Compose DEV, registered in Apartment / dev. Not Production.
# Uses existing apartment-dev PostgreSQL via its Docker bridge; does not create/alter DB.
name: apartment-dokploy-dev
services:
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: api
    image: apartment-api:dokploy-dev
    restart: unless-stopped
    init: true
    env_file:
      - /etc/dokploy/runtime-env/apartment-api.env
    # DEV single-replica startup: apply checked-in migrations before serving requests.
    command: ["sh", "-lc", "corepack pnpm --filter @apartment/api db:migrate && exec corepack pnpm --filter @apartment/api start"]
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "8088"
    volumes:
      - /root/Projects/Apartment/.private-payment-evidence:/workspace/.private-payment-evidence
    networks:
      - default
      - apartment-db
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8088/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 30s
  line-observer:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: api
    image: apartment-api:dokploy-dev
    restart: unless-stopped
    init: true
    env_file:
      - /etc/dokploy/runtime-env/apartment-api.env
    command: ["corepack", "pnpm", "--filter", "@apartment/api", "line:worker"]
    environment:
      NODE_ENV: development
      # Defense in depth: this dedicated DEV service is MONITOR ONLY.
      # A live sender requires separate provider/legal acceptance and a new review.
      LINE_WORKER_MODE: observe
      LINE_WORKER_APPROVED: "false"
      LINE_OUTBOUND_MODE: disabled
      LINE_WORKER_INTERVAL_MS: "60000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - apartment-db
    healthcheck:
      test: ["CMD", "node", "-e", "const f=require('node:fs');try{const t=Number(f.readFileSync('/tmp/apartment-line-worker-heartbeat','ascii'));process.exit(Number.isFinite(t)&&Date.now()-t<180000?0:1)}catch{process.exit(1)}"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: web
      args:
        VITE_LIFF_ID: ${VITE_LIFF_ID:-}
    image: apartment-web:dokploy-dev
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:18089:80"
    # Public HTTPS is routed ONLY by the existing Dokploy Traefik service.
    # Keep web access via the private loopback port for DEV diagnostics.
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.apartme-http.rule: "Host(`apartme.makemarket.space`)"
      traefik.http.routers.apartme-http.entrypoints: web
      traefik.http.routers.apartme-http.middlewares: apartme-https-only
      traefik.http.routers.apartme-http.service: apartme-web
      traefik.http.middlewares.apartme-https-only.redirectscheme.scheme: https
      traefik.http.middlewares.apartme-https-only.redirectscheme.permanent: "true"
      traefik.http.routers.apartme-secure.rule: "Host(`apartme.makemarket.space`)"
      traefik.http.routers.apartme-secure.entrypoints: websecure
      traefik.http.routers.apartme-secure.tls: "true"
      traefik.http.routers.apartme-secure.tls.certresolver: letsencrypt
      traefik.http.routers.apartme-secure.service: apartme-web
      traefik.http.services.apartme-web.loadbalancer.server.port: "80"
    networks:
      - default
      - dokploy-network
networks:
  dokploy-network:
    external: true
    name: dokploy-network
  apartment-db:
    external: true
    name: apartment-dev_default
